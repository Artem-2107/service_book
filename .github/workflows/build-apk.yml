name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "flet[all]"
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Build APK
      run: |
        cd frontend
        yes | flet build apk
    
    - name: Find APK file
      run: |
        echo "Searching for APK file..."
        find frontend -name "*.apk" -type f
        APK_PATH=$(find frontend -name "*.apk" -type f | head -n 1)
        echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ServiceBook-APK
        path: ${{ env.APK_PATH }}
        if-no-files-found: error